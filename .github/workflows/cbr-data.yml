name: Bank of Russia snapshot

# Takes the Bank of Russia snapshot (key rate, RUONIA, the zero-coupon
# yield curve of federal loan bonds and inflation, each with its source
# URL and retrieval time) every day after the figures of the day are out
# (RUONIA is published at about 14:20 Moscow time; 11:45 UTC is 14:45),
# and commits it to the orphan branch `cbr-data`. main is never written:
# the app builds on the snapshot committed in data/cbr/, which a pull
# request refreshes from this branch.

on:
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch:

# The token starts with no permission; each job states what it needs.
permissions: {}

concurrency:
  group: cbr-data
  cancel-in-progress: false

jobs:
  # Fetches and parses cbr.ru with a token that can only read: what the
  # network answers is handled here, away from the job that can push.
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The parsers first, on the saved responses: a failure here means the
      # code is broken, not cbr.ru.
      - run: node --test scripts/cbr-snapshot.test.mjs
      - run: node scripts/cbr-snapshot.mjs --out "$RUNNER_TEMP/snapshot.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot.json
          if-no-files-found: error
          retention-days: 7

  # Commits the snapshot to the orphan branch `cbr-data`. The only job
  # that can write, and it runs git and jq, nothing from the repository.
  publish:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job pushes to the cbr-data branch, so it keeps the credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: ${{ runner.temp }}
      - name: Commit to the cbr-data branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$RUNNER_TEMP/cbr-data-branch"
          status=0
          git ls-remote --exit-code origin refs/heads/cbr-data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin cbr-data
            git worktree add -B cbr-data "$branch" FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach "$branch"
            git -C "$branch" switch --orphan cbr-data
          else
            exit "$status"
          fi
          cp "$RUNNER_TEMP/snapshot.json" "$branch/snapshot.json"
          cd "$branch"
          git add snapshot.json
          if git diff --cached --quiet; then
            echo "The snapshot is unchanged."
            exit 0
          fi
          retrieved="$(jq -er '.retrievedAt | strings' snapshot.json)"
          git commit -q -m "Bank of Russia snapshot retrieved at ${retrieved}"
          git push origin HEAD:refs/heads/cbr-data
