name: Audit

# Known vulnerabilities in the npm and Cargo dependencies, and the
# licences and sources of the crates. On every pull request and push to
# main, and every Monday: an advisory is published without anything
# changing here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pnpm audit reads pnpm-lock.yaml and asks the registry about the
  # versions in it: nothing is installed and no package script runs, so
  # the linked Stoa packages and the WebAssembly packages are not needed.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # What ships to the browser: any advisory fails, whatever its
      # severity. The set is small, so each one can be read.
      - name: Production dependencies, any severity
        run: pnpm audit --prod --audit-level=low
      # The build and test tools run on a developer's machine and in CI,
      # never in the published page. Their low and moderate advisories are
      # mostly about dev servers open to a network and are printed, not
      # failed on; high and critical ones fail.
      - name: Every dependency, high and critical
        run: pnpm audit --audit-level=high

  # cargo-deny with deny.toml: RustSec advisories and yanked versions,
  # licences, duplicate versions and sources, for every crate in
  # Cargo.lock. The advisory database is fetched at run time; it is data,
  # and has to be current.
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: rustup show
      # A prebuilt binary at a pinned version, checked against the SHA-256
      # sum in the pinned action's manifest.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.19.0
      - run: cargo deny check
