[workspace]
members = ["crates/tyche-yield", "crates/tyche-market"]
resolver = "2"

[workspace.dependencies]
tyche-yield = { path = "crates/tyche-yield", version = "0.1.0" }

# Profiles apply to the whole workspace; a member's own [profile] would be
# ignored. The release profile is tyche-yield's, because its WebAssembly
# module ships to the browser. Measured in Valkyra-Labs/horkos-yield at
# fd23e70 (60-issue set, derive and calculate, best of 300 under Node):
# opt-level 3 with LTO and one codegen unit is 64,861 bytes (24,975
# gzipped) at 9.61 ms; the default is 68,932 (26,446) at 9.63 ms; "s"
# 64,454 (25,574) at 9.75 ms; "z" 64,571 (25,636) at 9.96 ms.
[profile.release]
lto = true
codegen-units = 1

# tyche-market kept line tables in release builds, for profiling.
[profile.release.package.tyche-market]
debug = 1
